# loadline server corpus v0
#
# The 15 servers ratified in docs/server-selection.md Part B, as amended
# 2026-08-17 (Grafana and Atlassian/Jira excluded under the partial-surface
# rule, B.2.1; Figma and Context7 promoted from the reserve bench, B.5).
#
# Fields left unresolved by docs/server-selection.md are marked with a
# "TODO verify at onboarding" comment rather than guessed.

servers:
  # --- Dev tools (5) ---

  - id: github
    name: GitHub MCP server
    category: dev-tools
    maintainer_type: official
    repo: https://github.com/github/github-mcp-server
    endpoint: https://api.githubcopilot.com/mcp/
    transport: [stdio, remote]
    auth:
      required: true
      # RESOLVED 2026-08-18 via https://github.com/github/github-mcp-server
      # (checked live): the env var the server itself reads is
      # GITHUB_PERSONAL_ACCESS_TOKEN, not GITHUB_TOKEN (this corpus's prior
      # value was a guess and wrong). Distribution today: remote hosted HTTP
      # at https://api.githubcopilot.com/mcp/ (OAuth or PAT via Authorization:
      # Bearer), a public Docker image ghcr.io/github/github-mcp-server, or a
      # local binary built from cmd/github-mcp-server and run as
      # `github-mcp-server stdio`. This corpus keeps the remote-HTTP form
      # (stdio's package block stays unresolved below; remote is what
      # resolveLaunch falls back to and what was scanned 2026-08-18).
      # PC-sweep probe result 2026-08-18: scanned with a classic PAT
      # (scopes gist, read:org, repo, workflow) via the operator's `gh auth
      # token` -- see docs/pc-sweep-runbook.md and the probe run for the
      # tool_count and whether the ~113-tool full-surface expectation was
      # met on this credential.
      token_env: GITHUB_PERSONAL_ACCESS_TOKEN
    package:
      stdio:
        type: binary
        # Still TODO verify at onboarding: pin exact release and decide
        # binary vs. Docker distribution for the stdio path specifically.
        # Not needed for this probe: the remote endpoint above is what
        # resolveLaunch uses since this block has no command set.
    flags:
      - auth-verification: classic-PAT-scope-filtering
        resolvable: likely, via OAuth flow instead of a classic PAT; needs live verification

  - id: filesystem
    name: Filesystem MCP server (reference implementation)
    category: dev-tools
    maintainer_type: official
    repo: https://github.com/modelcontextprotocol/servers
    transport: [stdio]
    auth:
      required: false
      token_env: null
    package:
      stdio:
        type: npm
        name: "@modelcontextprotocol/server-filesystem"
        # TODO verify at onboarding: pin an exact released version.
        # The server refuses to start without at least one allowed directory.
        # {{SCRATCH}} is substituted with the per-run scratch directory at
        # launch and kept verbatim in the run record, so the recorded argument
        # vector stays reproducible instead of citing one run's temp path.
        args: ["{{SCRATCH}}"]
    flags: []

  - id: fetch
    name: Fetch MCP server (reference implementation)
    category: dev-tools
    maintainer_type: official
    repo: https://github.com/modelcontextprotocol/servers
    transport: [stdio]
    auth:
      required: false
      token_env: null
    package:
      stdio:
        type: pypi
        name: mcp-server-fetch
        # Unpinned by decision, ratified 2026-08-18 (docs/pc-sweep-runbook.md
        # section 3): mcp-server-fetch's broken upstream dependency bound
        # (mcp>=1.1.3, no upper bound, resolves to a mcp 2.0.0 that renamed
        # McpError) is left unpatched. The row publishes as unreachable; that
        # is honest data about a widely-used reference server, not a defect
        # in this corpus. Re-check upstream each monthly run; the row heals
        # itself once mcp-server-fetch ships a compatible version, with no
        # servers.yaml edit needed.
    flags: []

  - id: kubernetes
    name: Kubernetes MCP server (containers/kubernetes-mcp-server)
    category: dev-tools
    maintainer_type: community
    repo: https://github.com/containers/kubernetes-mcp-server
    transport: [stdio, remote]
    auth:
      # RESOLVED 2026-08-18 via https://github.com/containers/kubernetes-mcp-server
      # README (checked live), "Configuration Options" table: kubeconfig
      # resolution is either the `--kubeconfig` CLI flag or, when not
      # provided, automatic resolution ("in-cluster, default location,
      # etc."). That automatic path is client-go's clientcmd loading rules,
      # which honor the standard KUBECONFIG environment variable ahead of
      # the default ~/.kube/config path -- the same convention every
      # kubectl-family tool uses, not something specific to this server.
      # This harness's credential() helper (internal/sweep/acquire.go) only
      # knows how to pass one env var through to the launched subprocess, so
      # KUBECONFIG is the convention that fits it: no --kubeconfig CLI flag
      # needed, just export KUBECONFIG to the kind cluster's kubeconfig path
      # before the scan.
      required: true
      token_env: KUBECONFIG
    package:
      stdio:
        type: npm
        # RESOLVED 2026-08-18 via https://registry.npmjs.org/kubernetes-mcp-server
        # (latest dist-tag 0.0.66, matches the GitHub release
        # containers/kubernetes-mcp-server v0.0.66) and the README's
        # "Getting Started" / "Configuration" sections (checked live): npx is
        # the primary documented launch method ("If you have npm installed,
        # this is the fastest way to get started"), alongside uvx, a native
        # binary, and a Helm-chart-deployed container image
        # (oci://ghcr.io/containers/charts/kubernetes-mcp-server) with no
        # plain `docker run`-able image reference documented. npm chosen to
        # match this harness's existing npm/npx convention and because it
        # needs no separate image pull or container networking to reach the
        # kind cluster's API server.
        name: kubernetes-mcp-server
        version: "0.0.66"
    flags: []

  - id: cloudflare
    name: Cloudflare MCP server (cloudflare/mcp-server-cloudflare)
    category: dev-tools
    maintainer_type: official
    repo: https://github.com/cloudflare/mcp-server-cloudflare
    # RESOLVED 2026-08-18 via https://developers.cloudflare.com/agents/
    # model-context-protocol/mcp-servers-for-cloudflare/ (checked live): 16+
    # product-scoped remote servers still exist at their own *.mcp.cloudflare.com
    # subdomains (docs, bindings, builds, observability, radar, containers,
    # browser, logs, ai-gateway, autorag, auditlogs, dns-analytics, dex, casb,
    # graphql, agents...), but there is now also a single aggregate endpoint,
    # "Cloudflare API MCP server", documented as covering "over 2,500
    # endpoints across DNS, Workers, R2, Zero Trust, and every other
    # product." Picked as this corpus's one entry per the runbook's decision
    # to choose the documented primary/aggregate endpoint over a
    # per-product one. tools/list probed keyless 2026-08-18: HTTP 401 (no
    # credential), consistent with auth.required.
    endpoint: https://mcp.cloudflare.com/mcp
    transport: [remote]
    auth:
      required: true
      token_env: CLOUDFLARE_API_TOKEN
    package: {}
    flags:
      - note: tool count not aggregated across the 16 product-scoped servers; needs a live tools/list pass at onboarding (docs/server-selection.md B.2 item 5)
      - note: endpoint resolved 2026-08-18 to the aggregate https://mcp.cloudflare.com/mcp rather than one of the 16 product-scoped subdomains; see comment above
      - note: "keyless probe 2026-08-18: HTTP 401 from the aggregate endpoint. Confirms auth is genuinely required."

  # --- Productivity / SaaS (5) ---

  - id: notion
    name: Notion MCP server
    category: productivity-saas
    maintainer_type: official
    repo: https://github.com/makenotion/notion-mcp-server
    transport: [stdio, remote]
    auth:
      # CORRECTED 2026-08-18 by empirical probe: `npx -y
      # @notionhq/notion-mcp-server@2.5.1` with no NOTION_TOKEN set answered
      # tools/list with status ok, 24 tools, full schemas, no degraded/partial
      # flag (see probe run, scratch, 2026-08-18). This corpus previously
      # declared required: true by inference from the README's setup
      # instructions; the empirical result contradicts that. tools/list
      # itself is keyless -- same pattern as context7. NOTION_TOKEN is still
      # required to actually call the tools (share-a-page auth), just not to
      # enumerate them, so Tier 1 measurement (tools/list only) needs no
      # credential here.
      required: false
      token_env: NOTION_TOKEN
    package:
      stdio:
        type: npm
        name: "@notionhq/notion-mcp-server"
        # Verified 2026-08-18 via https://registry.npmjs.org/@notionhq/notion-mcp-server
        version: "2.5.1"
    flags:
      - note: keyless tools/list probe 2026-08-18 confirmed full enumeration, 24 tools, npm @notionhq/notion-mcp-server@2.5.1, no NOTION_TOKEN set; auth.required corrected to false accordingly (see comment above). Prior runbook expectation of ~22 tools (v2.0.0) is superseded by the live v2.5.1 count of 24.

  - id: slack
    name: Slack MCP server (korotovsky/slack-mcp-server, community)
    category: productivity-saas
    maintainer_type: community
    repo: https://github.com/korotovsky/slack-mcp-server
    transport: [stdio, sse, remote]
    auth:
      required: true
      # Decision, ratified 2026-08-18: OAuth mode, not stealth browser-cookie
      # mode. A neutral public benchmark cannot rest on session-cookie
      # extraction that violates the platform's terms and that third parties
      # cannot reproduce; governance promises the harness is re-runnable with
      # anyone's own credentials. If OAuth's tool surface is smaller than
      # stealth mode's, this row publishes as partial_surface or is excluded
      # under the selection rule's partial-surface gate, and that is the
      # accepted cost of the principle. Verified live 2026-08-18 via
      # https://github.com/korotovsky/slack-mcp-server README: four auth
      # modes exist (SLACK_MCP_XOXC_TOKEN/SLACK_MCP_XOXD_TOKEN browser-session
      # "stealth" cookies, SLACK_MCP_XOXP_TOKEN user OAuth token,
      # SLACK_MCP_XOXB_TOKEN bot token). SLACK_MCP_XOXP_TOKEN (user OAuth) is
      # the mode declared here rather than the bot token, because the README
      # documents the bot token as losing search.messages, unread-counts, and
      # saved_* tools, while the user OAuth token carries no such documented
      # loss. See docs/pc-sweep-runbook.md's slack section for the full
      # rationale and the operator task.
      token_env: SLACK_MCP_XOXP_TOKEN
    package:
      stdio:
        type: npm
        name: slack-mcp-server
        # Verified 2026-08-18 via https://registry.npmjs.org/slack-mcp-server
        version: "1.3.0"
    flags:
      - decision: oauth-not-stealth-ratified-2026-08-18
        note: >-
          Compliance decision made; see auth block comment above and
          docs/pc-sweep-runbook.md for rationale. Not an open TODO anymore.
      - onboarding-task: surface-comparison-check
        detail: >-
          Create the Slack OAuth app and SLACK_MCP_XOXP_TOKEN, run a live
          tools/list against it, and compare the returned tool count against
          the server's documented full (stealth-mode) tool list before this
          row publishes as a ranking rather than partial_surface.
      - note: >-
          keyless probe 2026-08-18: npx -y slack-mcp-server@1.3.0 with no
          credential set crashes at startup (fatal log: "Authentication
          required: Either SLACK_MCP_XOXP_TOKEN, SLACK_MCP_XOXB_TOKEN, or both
          SLACK_MCP_XOXC_TOKEN and SLACK_MCP_XOXD_TOKEN must be provided"),
          exiting before answering initialize. The harness records this as
          unreachable (broken-pipe on stdin), not auth, because the process
          dies before any JSON-RPC exchange; the stderr text is the honest
          reason. No remote endpoint is declared in this corpus entry, so no
          alternate transport was available to probe. Confirms auth is
          genuinely required, hard-gated at process start.

  - id: linear
    name: Linear MCP server
    category: productivity-saas
    maintainer_type: official
    repo: null
    endpoint: https://mcp.linear.app/mcp
    transport: [remote]
    auth:
      required: true
      # TODO verify at onboarding: OAuth 2.1, API key, or enterprise
      # SAML/Okta; pick one and record the chosen env var name.
      token_env: LINEAR_API_KEY
    package: {}
    flags:
      - auth-verification: readonly-endpoint-truncates-surface
        resolvable: "yes: use the full /mcp endpoint with a write-scoped credential, not /mcp/readonly"
      - note: >-
          keyless probe 2026-08-18 against the full /mcp endpoint: HTTP 401
          {"error":"invalid_token","error_description":"Missing or invalid
          access token"}. Confirms auth is genuinely required and the
          endpoint itself (not readonly) is reachable and answers cleanly.

  - id: stripe
    name: Stripe MCP server
    category: productivity-saas
    maintainer_type: official
    repo: https://github.com/stripe/ai
    endpoint: https://mcp.stripe.com
    transport: [remote]
    auth:
      required: true
      token_env: STRIPE_API_KEY
    package: {}
    flags:
      - note: >-
          keyless probe 2026-08-18: HTTP 401 {"error":"Unauthorized. See
          https://docs.stripe.com/mcp for usage instructions."}. Confirms
          auth is genuinely required.

  - id: figma
    name: Figma MCP server
    category: productivity-saas
    maintainer_type: official
    # RESOLVED 2026-08-18 via https://developers.figma.com/docs/figma-mcp-server/
    # and https://help.figma.com/hc/en-us/articles/32132100833559 (checked
    # live): the primary candidate is neither of the two repos this corpus
    # weighed at B.2 item 10. Figma ships an official remote-hosted server at
    # https://mcp.figma.com/mcp (recommended, broadest tool set) and a
    # desktop-app-local variant serving the same surface one selection at a
    # time; figma/mcp-server-guide is a docs/guide repo, not the server
    # implementation. repo kept pointing at the guide repo since there is no
    # separate first-party server source repo to cite.
    repo: https://github.com/figma/mcp-server-guide
    endpoint: https://mcp.figma.com/mcp
    transport: [remote]
    auth:
      required: true
      # OAuth 2.1 only for the remote server (browser sign-in on first
      # connect, per Figma's docs), not a static API-token env var this
      # harness's remote dialer can pass as a Bearer header out of the box.
      # A community forum thread requests PAT-based auth support but it is
      # not shipped as of 2026-08-18. token_env left null: there is no env
      # var convention to declare, and the credential() resolver treats that
      # as "spec unresolved" rather than guessing one.
      token_env: null
    package: {}
    flags:
      - note: promoted from reserve bench 2026-08-17; auth/transport/endpoint resolved 2026-08-18 (see comment above); tool count still unmeasured -- OAuth-only auth means this harness cannot complete a keyless or single-token probe against it, only an interactive browser flow, which is out of scope for this pass
      - note: >-
          keyless probe 2026-08-18: HTTP 401 Unauthorized from
          https://mcp.figma.com/mcp. Confirms the endpoint is live and
          reachable and that auth is genuinely required; the OAuth-only gap
          above is the remaining blocker, not endpoint resolution.

  # --- Observability (2) ---

  - id: sentry
    name: Sentry MCP server
    category: observability
    maintainer_type: official
    repo: https://github.com/getsentry/sentry-mcp
    # Corrected 2026-08-18: the live JSON-RPC endpoint is /mcp, not the bare
    # host (curl confirms bare host serves a 200 landing page, while /mcp
    # answers 401 with no credential, matching a real MCP endpoint).
    endpoint: https://mcp.sentry.dev/mcp
    transport: [stdio, remote]
    auth:
      required: true
      token_env: SENTRY_ACCESS_TOKEN
    package:
      stdio:
        type: npm
        name: "@sentry/mcp-server"
        # Verified 2026-08-18 via https://registry.npmjs.org/@sentry/mcp-server
        version: "0.37.0"
    flags:
      - auth-verification: oauth-scope-gating
        resolvable: likely, via a broad-scope OAuth grant; needs live verification
      - note: one tool (analyze_issue_with_seer) may be gated to a paid Sentry plan, unconfirmed
      - note: >-
          endpoint path corrected 2026-08-18 from https://mcp.sentry.dev to
          https://mcp.sentry.dev/mcp; keyless probe against the corrected
          remote endpoint returned HTTP 401
          {"error":"invalid_token","error_description":"Missing or invalid
          access token"}, confirming auth is genuinely required there. The
          stdio path (this entry's default launch, npm @sentry/mcp-server)
          exits before answering JSON-RPC with "No access token was
          provided. Run `sentry-mcp auth login` ... or pass --access-token /
          SENTRY_ACCESS_TOKEN"; the harness records that as unreachable
          (crash before initialize), not auth, for the same reason as slack
          above. Both transports agree: auth is genuinely required.

  - id: jaeger
    name: Jaeger, via traceloop/opentelemetry-mcp-server (no dedicated official server exists)
    category: observability
    maintainer_type: community
    repo: https://github.com/traceloop/opentelemetry-mcp-server
    transport: [stdio, sse]
    auth:
      required: false
      token_env: null
      # Note: no credential required for the Jaeger backend specifically
      # (BACKEND_URL=http://localhost:16686). A token is only needed for
      # Traceloop's own backend option, which this project does not use.
    package:
      stdio:
        type: pypi
        name: opentelemetry-mcp
        # Verified 2026-08-17 via https://pypi.org/pypi/opentelemetry-mcp/json
        # (latest 0.2.2, matches docs/server-selection.md's tagged-release
        # figure) and the traceloop/opentelemetry-mcp-server README: installed
        # and run via uvx, backend selection is passed as CLI flags
        # (--backend jaeger --url <BACKEND_URL>), NOT the BACKEND_TYPE/
        # BACKEND_URL env vars this corpus's runbook originally assumed
        # (docs/pc-sweep-runbook.md section 2's env-var convention is
        # superseded by this finding; args below are the corrected launch).
        version: "0.2.2"
        args: ["--backend", "jaeger", "--url", "http://localhost:16686"]
    flags:
      - note: unified server across Jaeger, Tempo, and Traceloop's own backend; non-Jaeger tools inflate the apparent tool count and should be called out on the published row
      - note: not scanned in this pass; this machine has no docker/podman so the required local Jaeger all-in-one container could not be started. servers.yaml spec resolved and verified live, but no scan attempted. Stays on the PC-sweep list (docs/pc-sweep-runbook.md).

  # --- Data (2) ---

  - id: postgres
    name: Postgres MCP server, via crystaldba/postgres-mcp ("Postgres MCP Pro")
    category: data
    maintainer_type: community
    repo: https://github.com/crystaldba/postgres-mcp
    transport: [stdio, sse]
    auth:
      required: true
      token_env: DATABASE_URI
    package:
      stdio:
        type: pypi
        name: postgres-mcp
        # Verified 2026-08-17 via https://pypi.org/pypi/postgres-mcp/json
        # (latest 0.3.0) and https://github.com/crystaldba/postgres-mcp README:
        # installed/run via uvx, access mode is a CLI flag
        # (--access-mode=unrestricted), not an env var; DATABASE_URI stays an
        # env var per the maintainer's example config.
        version: "0.3.0"
        args: ["--access-mode=unrestricted"]
    flags:
      - note: launch in Unrestricted Mode for measurement; Restricted Mode truncates the tool surface by operator-set flag, not by credential
      - note: not scanned in this pass; this machine has no docker/podman so the required local postgres container could not be started. servers.yaml spec resolved and verified live, but no scan attempted. Stays on the PC-sweep list (docs/pc-sweep-runbook.md).

  - id: context7
    name: Context7 MCP server
    category: data
    maintainer_type: official
    repo: https://github.com/upstash/context7
    transport: [stdio, remote]
    auth:
      # Verified 2026-08-17 via https://github.com/upstash/context7 README
      # ("API Key Recommended: ... for higher rate limits") plus a live
      # empirical probe: `npx -y @upstash/context7-mcp@4.0.2` with no
      # CONTEXT7_API_KEY set answered tools/list with status ok, 2 tools
      # (resolve-library-id, query-docs), which is the server's full documented
      # tool surface. The API key gates query rate limits, not tool
      # enumeration, so no credential is required for Tier 1 measurement.
      required: false
      token_env: CONTEXT7_API_KEY
    package:
      stdio:
        type: npm
        name: "@upstash/context7-mcp"
        # Verified 2026-08-17 via https://registry.npmjs.org/@upstash/context7-mcp
        version: "4.0.2"
    flags:
      - note: >-
          promoted from reserve bench 2026-08-17; classified under data
          (documentation/knowledge retrieval) as a judgment call, not a
          strong categorical fit (docs/server-selection.md B.2 item 14).
          Auth/transport/package resolved 2026-08-17, keyless, npm
          @upstash/context7-mcp@4.0.2, stdio confirmed live (2 tools, no
          auth).

  # --- Browser automation (1) ---

  - id: playwright
    name: Playwright MCP server
    category: browser-automation
    maintainer_type: official
    repo: https://github.com/microsoft/playwright-mcp
    transport: [stdio, sse, remote]
    auth:
      required: false
      token_env: null
    package:
      stdio:
        type: npm
        name: "@playwright/mcp"
        # Verified 2026-08-17 via https://registry.npmjs.org/@playwright/mcp
        # (dist-tags.latest) and https://github.com/microsoft/playwright-mcp
        # README: package @playwright/mcp, stdio is the default transport, no
        # auth/API key required to start or answer tools/list.
        version: "0.0.79"
    flags: []

excluded:
  # Excluded under the partial-surface rule, ratified 2026-08-17.
  # See docs/server-selection.md B.2.1 for full rationale and evidence.
  - id: grafana
    name: Grafana MCP server
    reason: partial-surface-rule
    rationale: >-
      Agent Observability, Assistant, and Snowflake-datasource toolsets are
      gated behind Grafana Cloud and paid Enterprise/Assistant plugins; a
      free-tier, self-hosted OSS credential cannot reach the full tool
      surface.
  - id: atlassian
    name: Atlassian MCP server (Jira/Confluence)
    reason: partial-surface-rule
    rationale: >-
      Jira Service Management and Bitbucket Cloud tools require
      org-admin-provisioned licensed access, and Teamwork Graph is a paid
      Rovo-credits feature; a non-admin, unlicensed free-tier credential
      cannot reach the full tool surface.
